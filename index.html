<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="Estudio diario para la Convocatoria 67-2026 de la Procuraduría General de la Nación (Asesor 1AS-19, Oficina de Selección y Carrera).">
  <title>Mi Concurso 67</title>
  <link rel="manifest" href="manifest.webmanifest">

<body>

    <div class="brand">Mi Concurso 67</div>

  <nav class="tabs" aria-label="Secciones">
